<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Movie Night</title>
    <link rel="stylesheet" href="movies.css">
  </head>
  <body>
    <header>
      <h1>Movie Night</h1>
      <nav>
        <button class="nav-btn">Popular</button>
        <button class="nav-btn">Top Rated</button>
        <button class="nav-btn">Upcoming</button>
      </nav>
    </header>

    <main>
      <section id="featured">
        <h2>Featured tonight</h2>
        <div class="loader"></div>
      </section>

      <section class="movie-grid">
        <div class="card">
          <div class="poster"></div>
          <h3>Midnight Harbor</h3>
          <p class="rating high">8.1</p>
        </div>
        <div class="card">
          <div class="poster"></div>
          <h3>The Last Orbit</h3>
          <p class="rating high">7.6</p>
        </div>
        <div class="card">
          <div class="poster"></div>
          <h3>Paper Kingdoms</h3>
          <p class="rating low">4.3</p>
        </div>
        <div class="card">
          <div class="poster"></div>
          <h3>Echoes of Summer</h3>
          <p class="rating high">7.9</p>
        </div>
      </section>
    </main>
  </body>
</html>
